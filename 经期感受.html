<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>经期感受</title>
  <style>
    :root {
      --page-bg: #f5f5f8;
      --card-bg: #ffffff;
      --text-main: #303030;
      --text-muted: #d3d3d6;
      --stroke: #d9d9dd;
      --shadow: 0 10px 28px rgb(34 34 34 / 8%);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #2c2c2c;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      padding: 0;
    }

    .screen {
      position: relative;
      flex: 0 0 375px;
      width: 375px;
      min-width: 375px;
      height: 812px;
      min-height: 812px;
      overflow: hidden;
      background: var(--page-bg);
    }

    .stage {
      height: 100%;
      background: linear-gradient(180deg, #f7f7fa 0%, #f4f4f7 100%);
    }

    .experiment-switch {
      position: absolute;
      z-index: 3;
      top: 24px;
      left: 50%;
      display: flex;
      padding: 3px;
      border: 1px solid #e7e7eb;
      border-radius: 18px;
      background: rgb(255 255 255 / 88%);
      box-shadow: 0 4px 12px rgb(0 0 0 / 5%);
      transform: translateX(-50%);
    }

    .experiment-switch button {
      flex: 0 0 auto;
      min-width: 62px;
      height: 30px;
      padding: 0 12px;
      border: 0;
      border-radius: 15px;
      background: transparent;
      color: #8c8c92;
      font: 13px/30px "PingFang SC", "Microsoft YaHei", sans-serif;
      white-space: nowrap;
      cursor: pointer;
    }

    .experiment-switch button[aria-pressed="true"] {
      background: #ff5b99;
      color: #fff;
      box-shadow: 0 2px 6px rgb(255 91 153 / 30%);
    }

    .scheme-switch {
      position: absolute;
      z-index: 3;
      top: 70px;
      left: 50%;
      display: none;
      padding: 3px;
      border: 1px solid #e7e7eb;
      border-radius: 18px;
      background: rgb(255 255 255 / 88%);
      box-shadow: 0 4px 12px rgb(0 0 0 / 5%);
      transform: translateX(-50%);
    }

    .experiment-two .scheme-switch {
      display: flex;
    }

    .scheme-switch button {
      min-width: 62px;
      height: 30px;
      padding: 0 12px;
      border: 0;
      border-radius: 15px;
      background: transparent;
      color: #8c8c92;
      font: 13px/30px "PingFang SC", "Microsoft YaHei", sans-serif;
      white-space: nowrap;
      cursor: pointer;
    }

    .scheme-switch button[aria-pressed="true"] {
      background: #ff5b99;
      color: #fff;
      box-shadow: 0 2px 6px rgb(255 91 153 / 30%);
    }

    .quick-card {
      position: absolute;
      right: 12px;
      bottom: 91px;
      left: 12px;
      height: 142px;
      padding: 12px;
      border-radius: 19px;
      background: var(--card-bg);
      box-shadow: 0 0 20px rgb(0 0 0 / 8%);
    }

    .guide-bubble {
      position: absolute;
      z-index: 2;
      right: 84px;
      bottom: 249px;
      left: 12px;
      padding: 12px 14px;
      border-radius: 14px;
      background: rgb(55 55 55 / 78%);
      color: #fff;
      font-size: 15px;
      font-weight: 300;
      line-height: 22px;
      letter-spacing: 0.01em;
    }

    .guide-bubble::after {
      position: absolute;
      bottom: -9px;
      left: 35px;
      width: 0;
      height: 0;
      border-top: 10px solid rgb(55 55 55 / 78%);
      border-right: 10px solid transparent;
      border-left: 10px solid transparent;
      content: "";
    }

    .quick-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 0;
    }

    .quick-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: var(--text-main);
      font-size: 13px;
      line-height: 16px;
      text-align: center;
      white-space: nowrap;
    }

    .quick-item img {
      width: 26px;
      height: 26px;
      margin: 7px 0;
      object-fit: contain;
    }

    .menstrual-guide {
      position: relative;
      cursor: pointer;
    }

    .guide-icon {
      position: relative;
      z-index: 1;
      animation: menstrual-icon-guide 2.5s ease-in-out infinite;
      will-change: transform;
    }

    .guide-halo {
      display: none;
      position: absolute !important;
      z-index: 0;
      top: -2px;
      left: 50%;
      width: 44px !important;
      height: 44px !important;
      margin: 0 !important;
      pointer-events: none;
    }

    .menstrual-guide::before,
    .menstrual-guide::after {
      position: absolute;
      top: 4px;
      left: 50%;
      width: 28px;
      height: 28px;
      padding: 1.5px;
      border: 0;
      border-radius: 50%;
      background: linear-gradient(135deg, #ffdbe7, #feddfa);
      content: "";
      opacity: 0;
      transform: translateX(-50%) scale(.9286);
      animation: menstrual-guide-ring 2.5s ease-out infinite;
      -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    .menstrual-guide::before {
      animation: menstrual-guide-ring 2.5s ease-out infinite 500ms;
    }

    @keyframes menstrual-icon-guide {
      0%,
      100% { transform: scale(1); }
      20% { transform: scale(1.1); }
      36% { transform: scale(0.98); }
      52% { transform: scale(1.03); }
      65% { transform: scale(1); }
    }

    @keyframes menstrual-guide-ring {
      0% { opacity: 1; transform: translateX(-50%) scale(.9286); }
      48% { opacity: 0; transform: translateX(-50%) scale(1.5714); }
      100% { opacity: 0; transform: translateX(-50%) scale(1.5714); }
    }

    .scheme-one .guide-icon {
      animation: none;
    }

    .scheme-one .menstrual-guide::before,
    .scheme-one .menstrual-guide::after {
      animation: none;
      opacity: 0;
    }

    .scheme-one .guide-halo {
      display: block;
      animation: menstrual-halo-rotate 2.5s linear infinite;
      will-change: transform;
    }

    .scheme-two .guide-icon {
      animation: menstrual-icon-sync 4s ease-in-out infinite;
    }

    .scheme-two .guide-halo {
      display: block;
      animation: menstrual-halo-sync 4s linear infinite;
      will-change: transform;
    }

    .scheme-two .menstrual-guide::before,
    .scheme-two .menstrual-guide::after {
      animation: none;
      opacity: 0;
    }

    .experiment-two .menstrual-guide .guide-icon,
    .experiment-two .menstrual-guide .guide-halo,
    .experiment-two .menstrual-guide::before,
    .experiment-two .menstrual-guide::after,
    .experiment-two .guide-bubble {
      display: none;
      animation: none;
    }

    .experiment-two .menstrual-guide {
      display: none;
    }

    .experiment-two .quick-grid {
      grid-template-columns: repeat(4, 1fr);
    }

    .interaction-note {
      position: absolute;
      z-index: 1;
      top: 292px;
      right: 24px;
      left: 24px;
      display: none;
      margin: 0;
      color: #9b9ba1;
      font-size: 14px;
      font-weight: 400;
      line-height: 20px;
      text-align: center;
    }

    .experiment-two .interaction-note {
      display: block;
    }

    @keyframes menstrual-halo-rotate {
      0% { opacity: 0; transform: translateX(-50%) rotate(0deg); }
      50% { opacity: 1; transform: translateX(-50%) rotate(180deg); }
      100% { opacity: 0; transform: translateX(-50%) rotate(360deg); }
    }

    @keyframes menstrual-icon-sync {
      0%,
      100% { transform: scale(1); }
      25% { transform: scale(1.1); }
      50% { transform: scale(1); }
      75% { transform: scale(1.1); }
    }

    @keyframes menstrual-halo-sync {
      0% { opacity: .1; transform: translateX(-50%) rotate(0deg) scale(1); }
      25% { transform: translateX(-50%) rotate(90deg) scale(1.1); }
      50% { opacity: 1; transform: translateX(-50%) rotate(180deg) scale(1); }
      75% { transform: translateX(-50%) rotate(270deg) scale(1.1); }
      100% { opacity: .1; transform: translateX(-50%) rotate(360deg) scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      .guide-icon,
      .menstrual-guide::before,
      .menstrual-guide::after,
      .scheme-one .guide-halo,
      .voice-entry::before,
      .voice-entry::after,
      .voice-entry.is-hold-to-talk .voice-label {
        animation: none;
      }
    }

    .voice-entry {
      position: absolute;
      right: 12px;
      bottom: 12px;
      left: 12px;
      display: flex;
      align-items: center;
      height: 48px;
      padding: 0 12px;
      border: 1px solid transparent;
      border-radius: 24px;
      background: #fff;
      isolation: isolate;
    }

    .voice-entry::before {
      position: absolute;
      inset: -1px;
      z-index: 0;
      padding: 2px;
      border-radius: inherit;
      background: linear-gradient(100deg, #ffb89f, #ffa3c2, #ffa8e6, #ffb89f);
      background-size: 300% 100%;
      animation: voice-border-flow 4s linear infinite;
      content: "";
      -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    .voice-entry::after {
      position: absolute;
      inset: -2px;
      z-index: -1;
      padding: 1px;
      border-radius: inherit;
      background: #ffb8cf;
      content: "";
      opacity: 0;
      animation: voice-border-pulse 1.8s ease-out infinite;
      -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    /* 实验组1固定使用方案2，输入框不播放任何边框或扩散动效。 */
    .experiment-one .voice-entry {
      border-color: #dfdfe1;
    }

    .experiment-one .voice-entry::before,
    .experiment-one .voice-entry::after {
      display: none;
      animation: none;
    }

    .experiment-one .voice-entry.is-hold-to-talk .voice-label {
      color: var(--text-muted);
      background: none;
      animation: none;
      -webkit-text-fill-color: currentColor;
    }

    .experiment-two .voice-entry {
      border-color: #dfdfe1;
    }

    @property --google-flow-angle {
      syntax: "<angle>";
      inherits: true;
      initial-value: 0deg;
    }

    @property --google-glow-opacity {
      syntax: "<number>";
      inherits: true;
      initial-value: 0.25;
    }

    @property --scheme-two-beam-angle {
      syntax: "<angle>";
      inherits: true;
      initial-value: 0deg;
    }

    @property --scheme-two-beam-opacity {
      syntax: "<number>";
      inherits: true;
      initial-value: 1;
    }

    /* 环形渐变按输入框周向分布，避免上下边重复同一段横向渐变。 */
    .experiment-two.scheme-one .voice-entry::before {
      display: block;
      inset: -1px;
      z-index: 2;
      padding: 2px;
      background: conic-gradient(
        from var(--google-flow-angle),
        #e5a8ff 0deg,
        #e5a8ff 90deg,
        #ffc470 144deg,
        #ff9abc 180deg,
        #ff8bb3 216deg,
        #ffb89f 270deg,
        #e5a8ff 360deg
      );
      animation: none;
    }

    .experiment-two.scheme-one .voice-entry::after {
      display: block;
      inset: -1px;
      z-index: 1;
      padding: 2px;
      border-radius: inherit;
      background: conic-gradient(
        from var(--google-flow-angle),
        #e5a8ff 0deg,
        #e5a8ff 90deg,
        #ffc470 144deg,
        #ff9abc 180deg,
        #ff8bb3 216deg,
        #ffb89f 270deg,
        #e5a8ff 360deg
      );
      opacity: calc(0.5 * var(--google-glow-opacity));
      filter: drop-shadow(0 0 5px rgb(255 139 179 / 0.5));
      animation: none;
    }

    .experiment-two .voice-entry.is-hold-to-talk .voice-label {
      color: #323232;
      background: none;
      animation: none;
      -webkit-text-fill-color: currentColor;
    }

    .experiment-two.scheme-one .quick-card {
      animation: google-flow-orbit 3.5s linear infinite;
    }

    .experiment-two.scheme-one .voice-entry {
      z-index: 1;
      animation: google-glow-cycle 3.5s linear infinite;
      box-shadow:
        0 0 8px rgb(255 139 179 / calc(0.55 * var(--google-glow-opacity))),
        0 0 16px rgb(255 139 179 / calc(0.35 * var(--google-glow-opacity))),
        inset 0 0 5px rgb(255 139 179 / calc(0.25 * var(--google-glow-opacity)));
    }

    .experiment-two.scheme-one .voice-entry > * {
      z-index: 3;
    }

    /* 方案2以彩色光束沿灰色输入框描边持续环绕。 */
    .experiment-two.scheme-two .voice-entry {
      border: 1px solid #dfdfe1;
      box-shadow: none;
      animation: scheme-two-beam-orbit 4s linear infinite;
    }

    .experiment-two.scheme-two .voice-entry::before,
    .experiment-two.scheme-two .voice-entry::after {
      display: block;
      inset: -1px;
      padding: 2px;
      border-radius: inherit;
      background: conic-gradient(
        from var(--scheme-two-beam-angle),
        transparent 0deg 42deg,
        rgb(229 168 255 / 0) 60deg,
        #e5a8ff 95deg,
        #ffc470 153deg,
        #ff9abc 212deg,
        #ff6cb9 270deg,
        #ffb89f 325deg,
        rgb(255 184 159 / 0) 360deg
      );
      animation: none;
    }

    .experiment-two.scheme-two .voice-entry::before {
      z-index: 2;
      opacity: var(--scheme-two-beam-opacity);
    }

    .experiment-two.scheme-two .voice-entry::after {
      z-index: 1;
      opacity: calc(0.9 * var(--scheme-two-beam-opacity));
      filter:
        drop-shadow(0 0 4px rgb(229 168 255 / 0.55))
        drop-shadow(0 0 4px rgb(255 108 185 / 0.5))
        drop-shadow(0 0 4px rgb(255 196 112 / 0.4));
    }

    .beam-interior {
      display: none;
    }

    /* 光束在框内投下由边缘向中心渐隐的同色环境光。 */
    .experiment-two.scheme-two .beam-interior {
      position: absolute;
      inset: 2px;
      z-index: 1;
      display: block;
      border-radius: inherit;
      background: conic-gradient(
        from var(--scheme-two-beam-angle),
        transparent 0deg 42deg,
        rgb(229 168 255 / 0) 60deg,
        rgb(229 168 255 / 0.52) 95deg,
        rgb(255 196 112 / 0.52) 153deg,
        rgb(255 154 188 / 0.58) 212deg,
        rgb(255 108 185 / 0.58) 270deg,
        rgb(255 184 159 / 0.52) 325deg,
        rgb(255 184 159 / 0) 360deg
      );
      filter: blur(12px);
      opacity: var(--scheme-two-beam-opacity);
      -webkit-mask-image: radial-gradient(
        ellipse at center,
        transparent 0%,
        transparent 38%,
        rgb(0 0 0 / 30%) 68%,
        #000 100%
      );
      mask-image: radial-gradient(
        ellipse at center,
        transparent 0%,
        transparent 38%,
        rgb(0 0 0 / 30%) 68%,
        #000 100%
      );
      pointer-events: none;
    }

    .experiment-two.scheme-two .voice-entry > * {
      z-index: 3;
    }

    .experiment-two.scheme-two .voice-entry:not(.is-hold-to-talk) .voice-label {
      color: rgb(0 0 0 / 20%);
    }

    @keyframes google-flow-orbit {
      0% { --google-flow-angle: 0deg; }
      100% { --google-flow-angle: 360deg; }
    }

    @keyframes google-glow-cycle {
      0% { --google-glow-opacity: 0.25; }
      33.3333%,
      66.6667% { --google-glow-opacity: 1; }
      100% { --google-glow-opacity: 0.25; }
    }

    @keyframes scheme-two-beam-orbit {
      0%,
      25%,
      100% {
        --scheme-two-beam-opacity: 1;
      }

      50%,
      75% {
        --scheme-two-beam-opacity: 0;
      }

      0% { --scheme-two-beam-angle: 0deg; }
      100% { --scheme-two-beam-angle: 360deg; }
    }

    .voice-entry > * {
      position: relative;
      z-index: 1;
    }

    .voice-entry.is-hold-to-talk {
      justify-content: center;
      padding: 0;
    }

    .voice-entry img {
      width: 26px;
      height: 26px;
      margin-right: 8px;
      object-fit: contain;
      opacity: 0.95;
    }

    .voice-toggle {
      cursor: pointer;
    }

    .voice-entry.is-hold-to-talk .voice-toggle {
      position: absolute;
      left: 12px;
      margin-right: 0;
    }

    .voice-entry span {
      color: var(--text-muted);
      font-size: 17px;
      line-height: 1;
      font-weight: 400;
      letter-spacing: 0.02em;
    }

    .voice-entry.is-hold-to-talk .voice-label {
      font-weight: 500;
      color: transparent;
      background: linear-gradient(100deg, #ff8965, #ff75a3, #ff5acb, #ff8965);
      background-size: 300% 100%;
      animation: voice-border-flow 4s linear infinite;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    @keyframes voice-border-flow {
      from { background-position: 0% 50%; }
      to { background-position: 300% 50%; }
    }

    @keyframes voice-border-pulse {
      0% { opacity: 1; inset: -2px; padding: 1.5px; border-radius: 24px; }
      41.6667% { opacity: 1; inset: -5px; padding: 1px; border-radius: 28px; }
      83.3333%,
      100% { opacity: 0; inset: -8px; padding: .5px; border-radius: 32px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .experiment-two.scheme-one .quick-card {
        animation: none;
      }

      .experiment-two.scheme-two .voice-entry {
        animation: none;
      }

    }

    .tabbar {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      display: block;
      width: 100%;
      height: 83px;
      object-fit: contain;
      background: #fff;
    }
  </style>
</head>
<body>
  <main class="screen experiment-two scheme-one" aria-label="经期感受页面">
    <div class="stage" aria-hidden="true"></div>

    <div class="experiment-switch" role="group" aria-label="实验组切换">
      <button type="button" data-experiment="one" aria-pressed="false">实验组1</button>
      <button type="button" data-experiment="two" aria-pressed="true">实验组2(设计中)</button>
    </div>

    <div class="scheme-switch" role="group" aria-label="实验组2方案切换">
      <button type="button" data-scheme="one" aria-pressed="true">方案1</button>
      <button type="button" data-scheme="two" aria-pressed="false">方案2</button>
    </div>

    <p class="interaction-note">键盘/语音切换按钮可点击</p>

    <section class="quick-card" aria-label="快捷记录">
      <div class="quick-grid">
        <div class="quick-item menstrual-guide" role="button" tabindex="0" aria-label="记录月经感受">
          <img class="guide-halo" src="./切图/光晕.png?v=20260902" alt="">
          <img class="guide-icon" src="./切图/月经感受.png" alt="">
          <span>月经感受</span>
        </div>
        <div class="quick-item">
          <img src="./切图/症状.png" alt="">
          <span>症状</span>
        </div>
        <div class="quick-item">
          <img src="./切图/体重.png" alt="">
          <span>体重</span>
        </div>
        <div class="quick-item">
          <img src="./切图/心情.png" alt="">
          <span>心情</span>
        </div>
        <div class="quick-item">
          <img src="./切图/饮食.png" alt="">
          <span>饮食</span>
        </div>
      </div>

      <div class="voice-entry" aria-label="记下这次血量变化、经期症状">
        <span class="beam-interior" aria-hidden="true"></span>
        <img class="voice-toggle" src="./切图/切换语音.png" alt="切换为语音输入" role="button" tabindex="0">
        <span class="voice-label">记下这次血量变化、经期症状</span>
      </div>
    </section>

    <aside class="guide-bubble" aria-label="功能引导">
      血量变化、经期症状，都能帮你快速记下来，立刻试试吧
    </aside>

    <img class="tabbar" src="./切图/TabBar.png" alt="底部导航">
  </main>
  <script>
    const screen = document.querySelector('.screen');
    const experimentButtons = document.querySelectorAll('[data-experiment]');
    const schemeButtons = document.querySelectorAll('[data-scheme]');
    const voiceEntry = document.querySelector('.voice-entry');
    const voiceToggle = document.querySelector('.voice-toggle');
    const voiceLabel = document.querySelector('.voice-label');

    function syncVoiceMode() {
      const isHoldToTalk = voiceEntry.classList.contains('is-hold-to-talk');
      voiceToggle.src = isHoldToTalk
        ? './切图/切换键盘.png'
        : './切图/切换语音.png';
      voiceToggle.alt = isHoldToTalk ? '切换为文字输入' : '切换为语音输入';
      voiceEntry.setAttribute('aria-label', isHoldToTalk ? '按住记录经期感受' : '记下这次血量变化、经期症状');
      voiceLabel.textContent = isHoldToTalk ? '按住记录经期感受' : '记下这次血量变化、经期症状';
    }

    function toggleVoiceMode() {
      voiceEntry.classList.toggle('is-hold-to-talk');
      syncVoiceMode();
    }

    let experimentTwoScheme = 'one';

    function setScheme(scheme) {
      experimentTwoScheme = scheme;
      screen.classList.toggle('scheme-one', scheme === 'one');
      screen.classList.toggle('scheme-two', scheme === 'two');
      schemeButtons.forEach((item) => {
        item.setAttribute('aria-pressed', String(item.dataset.scheme === scheme));
      });
    }

    voiceToggle.addEventListener('click', toggleVoiceMode);
    voiceToggle.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        toggleVoiceMode();
      }
    });

    schemeButtons.forEach((button) => {
      button.addEventListener('click', () => {
        setScheme(button.dataset.scheme);
      });
    });

    experimentButtons.forEach((button) => {
      button.addEventListener('click', () => {
        const isExperimentTwo = button.dataset.experiment === 'two';
        screen.classList.toggle('experiment-two', isExperimentTwo);
        screen.classList.toggle('experiment-one', !isExperimentTwo);
        if (isExperimentTwo) {
          setScheme(experimentTwoScheme);
        } else {
          screen.classList.add('scheme-two');
          screen.classList.remove('scheme-one');
        }
        experimentButtons.forEach((item) => {
          item.setAttribute('aria-pressed', String(item === button));
        });
        syncVoiceMode();
      });
    });

  </script>
</body>
</html>
