<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>经期感受</title>
  <style>
    :root {
      --page-bg: #f5f5f8;
      --card-bg: #ffffff;
      --text-main: #303030;
      --text-muted: #d3d3d6;
      --stroke: #d9d9dd;
      --shadow: 0 10px 28px rgb(34 34 34 / 8%);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #2c2c2c;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      padding: 0;
    }

    .screen {
      position: relative;
      flex: 0 0 375px;
      width: 375px;
      min-width: 375px;
      height: 812px;
      min-height: 812px;
      overflow: hidden;
      background: var(--page-bg);
    }

    .stage {
      height: 100%;
      background: linear-gradient(180deg, #f7f7fa 0%, #f4f4f7 100%);
    }

    .experiment-switch,
    .scheme-switch {
      position: absolute;
      z-index: 3;
      left: 50%;
      display: flex;
      padding: 3px;
      border: 1px solid #e7e7eb;
      border-radius: 18px;
      background: rgb(255 255 255 / 88%);
      box-shadow: 0 4px 12px rgb(0 0 0 / 5%);
      transform: translateX(-50%);
    }

    .experiment-switch {
      top: 18px;
    }

    .scheme-switch {
      top: 62px;
    }

    .experiment-switch button,
    .scheme-switch button {
      min-width: 62px;
      height: 30px;
      padding: 0 12px;
      border: 0;
      border-radius: 15px;
      background: transparent;
      color: #8c8c92;
      font: 13px/30px "PingFang SC", "Microsoft YaHei", sans-serif;
      cursor: pointer;
    }

    .experiment-switch button[aria-pressed="true"],
    .scheme-switch button[aria-pressed="true"] {
      background: #ff5b99;
      color: #fff;
      box-shadow: 0 2px 6px rgb(255 91 153 / 30%);
    }

    .quick-card {
      position: absolute;
      right: 12px;
      bottom: 91px;
      left: 12px;
      height: 142px;
      padding: 12px;
      border-radius: 19px;
      background: var(--card-bg);
      box-shadow: 0 0 20px rgb(0 0 0 / 8%);
    }

    .guide-bubble {
      position: absolute;
      z-index: 2;
      right: 84px;
      bottom: 233px;
      left: 12px;
      padding: 12px 14px;
      border-radius: 14px;
      background: rgb(55 55 55 / 78%);
      color: #fff;
      font-size: 15px;
      font-weight: 300;
      line-height: 22px;
      letter-spacing: 0.01em;
    }

    .guide-bubble::after {
      position: absolute;
      bottom: -9px;
      left: 35px;
      width: 0;
      height: 0;
      border-top: 10px solid rgb(55 55 55 / 78%);
      border-right: 10px solid transparent;
      border-left: 10px solid transparent;
      content: "";
    }

    .quick-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 0;
    }

    .quick-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: var(--text-main);
      font-size: 13px;
      line-height: 16px;
      text-align: center;
      white-space: nowrap;
    }

    .quick-item img {
      width: 26px;
      height: 26px;
      margin: 7px 0;
      object-fit: contain;
    }

    .menstrual-guide {
      position: relative;
      cursor: pointer;
    }

    .guide-icon {
      position: relative;
      z-index: 1;
      animation: menstrual-icon-guide 2.5s ease-in-out infinite;
      will-change: transform;
    }

    .scheme-two-icon {
      position: relative;
      z-index: 1;
      display: none;
      width: 26px;
      height: 26px;
      margin: 7px 0;
    }

    .scheme-two-icon img {
      display: block;
      width: 26px !important;
      height: 26px !important;
      margin: 0 !important;
    }

    .guide-bars {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
      padding-top: 3px;
      pointer-events: none;
    }

    .guide-bars i {
      display: block;
      width: 2.5px;
      height: 10px;
      border-radius: 4px;
      background: linear-gradient(180deg, #fff 0%, #ffcfe0 100%);
    }

    .guide-halo {
      display: none;
      position: absolute !important;
      z-index: 0;
      top: -4px;
      left: 50%;
      width: 48px !important;
      height: 48px !important;
      margin: 0 !important;
      pointer-events: none;
    }

    .menstrual-guide::before,
    .menstrual-guide::after {
      position: absolute;
      top: 4px;
      left: 50%;
      width: 28px;
      height: 28px;
      padding: 1.5px;
      border: 0;
      border-radius: 50%;
      background: linear-gradient(135deg, #ffdbe7, #feddfa);
      content: "";
      opacity: 0;
      transform: translateX(-50%) scale(.9286);
      animation: menstrual-guide-ring 2.5s ease-out infinite;
      -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    .menstrual-guide::before {
      animation: menstrual-guide-ring 2.5s ease-out infinite 500ms;
    }

    @keyframes menstrual-icon-guide {
      0%,
      100% { transform: scale(1); }
      20% { transform: scale(1.1); }
      36% { transform: scale(0.98); }
      52% { transform: scale(1.03); }
      65% { transform: scale(1); }
    }

    @keyframes menstrual-guide-ring {
      0% { opacity: 1; transform: translateX(-50%) scale(.9286); }
      48% { opacity: 0; transform: translateX(-50%) scale(1.5714); }
      100% { opacity: 0; transform: translateX(-50%) scale(1.5714); }
    }

    .scheme-two .guide-icon {
      display: none;
      animation: none;
    }

    .scheme-two .scheme-two-icon {
      display: block;
    }

    .scheme-two .guide-bars i {
      animation: guide-bar-pulse 2.5s ease-in-out infinite;
      transform-origin: center;
      will-change: transform;
    }

    .scheme-two .guide-bars i:nth-child(2) {
      animation-delay: 220ms;
    }

    .scheme-two .guide-bars i:nth-child(3) {
      animation-delay: 440ms;
    }

    @keyframes guide-bar-pulse {
      0%,
      40%,
      68%,
      100% { opacity: .72; transform: scaleY(.5); }
      20%,
      60% { opacity: 1; transform: scaleY(1); }
    }

    .scheme-two .menstrual-guide::before,
    .scheme-two .menstrual-guide::after {
      animation: none;
      opacity: 0;
    }

    .scheme-two .guide-halo {
      display: block;
      animation: menstrual-halo-rotate 2.5s linear infinite;
      will-change: transform;
    }

    .experiment-two .menstrual-guide .guide-icon,
    .experiment-two .menstrual-guide .scheme-two-icon,
    .experiment-two .menstrual-guide .guide-halo,
    .experiment-two .menstrual-guide::before,
    .experiment-two .menstrual-guide::after,
    .experiment-two .guide-bubble {
      display: none;
      animation: none;
    }

    .experiment-two .menstrual-guide {
      display: none;
    }

    .experiment-two .quick-grid {
      grid-template-columns: repeat(4, 1fr);
    }

    .experiment-two .scheme-switch [data-scheme="two"] {
      display: none;
    }

    @keyframes menstrual-halo-rotate {
      0% { opacity: 0; transform: translateX(-50%) rotate(0deg); }
      50% { opacity: 1; transform: translateX(-50%) rotate(180deg); }
      100% { opacity: 0; transform: translateX(-50%) rotate(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .guide-icon,
      .menstrual-guide::before,
      .menstrual-guide::after,
      .scheme-two .guide-halo,
      .scheme-two .guide-bars i {
        animation: none;
      }
    }

    .voice-entry {
      position: absolute;
      right: 12px;
      bottom: 12px;
      left: 12px;
      display: flex;
      align-items: center;
      height: 48px;
      padding: 0 12px;
      border: 1px solid var(--stroke);
      border-radius: 24px;
      background: #fff;
    }

    .voice-entry.is-hold-to-talk {
      justify-content: center;
      padding: 0;
    }

    .voice-entry img {
      width: 26px;
      height: 26px;
      margin-right: 8px;
      object-fit: contain;
      opacity: 0.95;
    }

    .voice-toggle {
      cursor: pointer;
    }

    .voice-entry.is-hold-to-talk .voice-toggle {
      position: absolute;
      left: 12px;
      margin-right: 0;
    }

    .voice-entry span {
      color: var(--text-muted);
      font-size: 17px;
      line-height: 1;
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    .voice-entry.is-hold-to-talk .voice-label {
      color: var(--text-main);
      font-weight: 600;
    }

    .tabbar {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      display: block;
      width: 100%;
      height: 83px;
      object-fit: contain;
      background: #fff;
    }
  </style>
</head>
<body>
  <main class="screen experiment-one scheme-two" aria-label="经期感受页面">
    <div class="stage" aria-hidden="true"></div>

    <div class="experiment-switch" role="group" aria-label="实验组切换">
      <button type="button" data-experiment="one" aria-pressed="true">实验组1</button>
      <button type="button" data-experiment="two" aria-pressed="false">实验组2(设计中)</button>
    </div>

    <div class="scheme-switch" role="group" aria-label="引导动效方案">
      <button type="button" data-scheme="one" aria-pressed="false">方案1</button>
      <button type="button" data-scheme="two" aria-pressed="true">方案2</button>
    </div>

    <section class="quick-card" aria-label="快捷记录">
      <div class="quick-grid">
        <div class="quick-item menstrual-guide" role="button" tabindex="0" aria-label="记录月经感受">
          <img class="guide-halo" src="./切图/光晕.png" alt="">
          <img class="guide-icon" src="./切图/月经感受.png" alt="">
          <span class="scheme-two-icon" aria-hidden="true">
            <img src="./切图/月经感受-无条.png" alt="">
            <span class="guide-bars"><i></i><i></i><i></i></span>
          </span>
          <span>月经感受</span>
        </div>
        <div class="quick-item">
          <img src="./切图/症状.png" alt="">
          <span>症状</span>
        </div>
        <div class="quick-item">
          <img src="./切图/体重.png" alt="">
          <span>体重</span>
        </div>
        <div class="quick-item">
          <img src="./切图/心情.png" alt="">
          <span>心情</span>
        </div>
        <div class="quick-item">
          <img src="./切图/饮食.png" alt="">
          <span>饮食</span>
        </div>
      </div>

      <div class="voice-entry" aria-label="记录生活点滴">
        <img class="voice-toggle" src="./切图/切换语音.png" alt="切换为语音输入" role="button" tabindex="0">
        <span class="voice-label">记录生活点滴</span>
      </div>
    </section>

    <aside class="guide-bubble" aria-label="功能引导">
      血量变化、经期症状，都能帮你快速记下来，立刻试试吧
    </aside>

    <img class="tabbar" src="./切图/TabBar.png" alt="底部导航">
  </main>
  <script>
    const screen = document.querySelector('.screen');
    const experimentButtons = document.querySelectorAll('[data-experiment]');
    const schemeButtons = document.querySelectorAll('[data-scheme]');
    const voiceEntry = document.querySelector('.voice-entry');
    const voiceToggle = document.querySelector('.voice-toggle');
    const voiceLabel = document.querySelector('.voice-label');

    function toggleVoiceMode() {
      const isHoldToTalk = voiceEntry.classList.toggle('is-hold-to-talk');
      voiceToggle.src = isHoldToTalk ? './切图/切换键盘.png' : './切图/切换语音.png';
      voiceToggle.alt = isHoldToTalk ? '切换为文字输入' : '切换为语音输入';
      voiceEntry.setAttribute('aria-label', isHoldToTalk ? '按住说话' : '记录生活点滴');
      voiceLabel.textContent = isHoldToTalk ? '按住说话' : '记录生活点滴';
    }

    voiceToggle.addEventListener('click', toggleVoiceMode);
    voiceToggle.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        toggleVoiceMode();
      }
    });

    experimentButtons.forEach((button) => {
      button.addEventListener('click', () => {
        const isExperimentTwo = button.dataset.experiment === 'two';
        screen.classList.toggle('experiment-two', isExperimentTwo);
        screen.classList.toggle('experiment-one', !isExperimentTwo);
        if (isExperimentTwo) {
          screen.classList.remove('scheme-two');
          schemeButtons.forEach((item) => {
            item.setAttribute('aria-pressed', String(item.dataset.scheme === 'one'));
          });
        }
        experimentButtons.forEach((item) => {
          item.setAttribute('aria-pressed', String(item === button));
        });
      });
    });

    schemeButtons.forEach((button) => {
      button.addEventListener('click', () => {
        const isSchemeTwo = button.dataset.scheme === 'two';
        screen.classList.toggle('scheme-two', isSchemeTwo);
        schemeButtons.forEach((item) => {
          item.setAttribute('aria-pressed', String(item === button));
        });
      });
    });
  </script>
</body>
</html>
